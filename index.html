<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Faustine — Achat/Vente</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<template id="app-template">
<div class="app-shell {{ helpRootClass }}" style="display:flex;min-height:100vh;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#dfe4ec">

  <!-- Barre latérale -->
  <div class="app-sidebar" style="width:212px;flex-shrink:0;background:#fff;border-right:1px solid #eef1f6;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 6px 18px">
      <sc-if value="{{ entLogo }}" hint-placeholder-val="{{ false }}">
        <img src="{{ entLogo }}" alt="" style="width:36px;height:36px;border-radius:9px;object-fit:cover;flex-shrink:0">
      </sc-if>
      <sc-if value="{{ entNoLogo }}" hint-placeholder-val="{{ true }}">
        <div style="{{ brandStyle }}">{{ entInitials }}</div>
      </sc-if>
      <span style="font-size:14.5px;font-weight:600;color:#0e1b2e;line-height:1.2">Dashboard {{ entNom }}<span style="display:block;font-size:10px;font-weight:600;color:#9aa7b8;font-family:'IBM Plex Mono',monospace;margin-top:1px">{{ appVersion }}</span></span>
    </div>
    <div style="padding:0 0 14px" data-help="Indique qui utilise le tableau de bord. Cliquez pour changer de profil — un profil « simplifié » ne voit que les pages choisies pour lui dans Paramètres, un profil « admin » voit tout. Ce n'est pas un mot de passe, juste une aide pour ne montrer à chacun que l'essentiel." data-help-title="Profil utilisateur">
      <button style="{{ profilChipStyle }}" onclick="{{ onProfilToggle }}">
        <span style="flex-shrink:0">👤</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ profilChipLabel }}</span>
        <span style="font-size:10px;color:#9aa7b8;flex-shrink:0">▾</span>
      </button>
      <div style="font-size:10.5px;color:#9aa7b8;padding:4px 10px 0">{{ profilRoleLabel }}</div>
      <sc-if value="{{ profilMenuOpen }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:6px;background:#fff;border:1px solid #e9edf4;border-radius:10px;padding:4px;box-shadow:0 8px 20px -10px rgba(14,27,46,.25)">
          <sc-for list="{{ profilItems }}" as="p" hint-placeholder-count="2">
            <button style="{{ p.style }}" onclick="{{ p.onClick }}">
              <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.label }}</span>
              <span style="font-size:10px;color:#9aa7b8;flex-shrink:0">{{ p.roleLabel }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <sc-for list="{{ navGroups }}" as="nav" hint-placeholder-count="6">
      <button data-help="{{ nav.help }}" data-help-title="{{ nav.name }}" style="{{ nav.tabStyle }}" onclick="{{ nav.onClick }}">{{ nav.name }}</button>
      <sc-if value="{{ nav.subItems.length }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ nav.subItems }}" as="sub" hint-placeholder-count="3">
          <button data-help="{{ sub.help }}" data-help-title="{{ sub.name }}" style="{{ sub.tabStyle }}" onclick="{{ sub.onClick }}">{{ sub.name }}</button>
        </sc-for>
      </sc-if>
    </sc-for>
  </div>

  <!-- Contenu principal -->
  <div class="app-main" style="flex:1;min-width:0;padding:32px;overflow-x:auto">
  <div class="app-card" style="max-width:1440px;min-width:1020px;margin:0 auto;background:#f6f8fc;border:1px solid #e2e8f1;border-radius:18px;overflow:hidden;box-shadow:0 20px 44px -24px rgba(14,27,46,.28)">

    <!-- Top bar -->
    <div class="app-topbar" style="display:flex;justify-content:flex-end;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid #eef1f6">
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
        <div style="position:relative" data-help="Recherche dans toutes vos données à la fois : ventes, achats pêcheurs, factures fournisseur, Grenke et bordereaux. Cliquez sur un résultat pour ouvrir la bonne page déjà filtrée." data-help-title="Recherche globale">
          <input style="{{ globalSearchStyle }}" placeholder="🔍 Rechercher partout…" value="{{ globalQuery }}" oninput="{{ onGlobalQuery }}" onfocus="{{ onGlobalFocus }}" onblur="{{ onGlobalBlur }}">
          <sc-if value="{{ globalOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:calc(100% + 6px);left:0;width:340px;max-height:420px;overflow:auto;background:#fff;border:1px solid #e2e8f1;border-radius:12px;box-shadow:0 16px 32px -12px rgba(14,27,46,.35);z-index:80;padding:8px">
              <sc-for list="{{ globalGroups }}" as="g" hint-placeholder-count="2">
                <div style="padding:6px 8px 2px;font-size:10.5px;font-weight:700;color:#93a1b3;text-transform:uppercase;letter-spacing:.4px">{{ g.name }}</div>
                <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
                  <div style="padding:8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px" onmousedown="{{ it.onClick }}">
                    <span style="font-size:12.5px;color:#0e1b2e;font-weight:500;font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span>
                    <span style="font-size:11.5px;color:#9aa7b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">{{ it.sub }}</span>
                  </div>
                </sc-for>
              </sc-for>
              <sc-if value="{{ globalEmpty }}" hint-placeholder-val="{{ false }}">
                <div style="padding:14px 8px;font-size:12.5px;color:#9aa7b8;font-style:italic;text-align:center">Aucun résultat pour « {{ globalQuery }} ».</div>
              </sc-if>
            </div>
          </sc-if>
        </div>
        <sc-if value="{{ isAdminUI }}" hint-placeholder-val="{{ true }}">
          <button data-help="Bascule l'affichage de tous les montants entre TTC (toutes taxes comprises) et HT (hors taxes). Une fenêtre de confirmation s'ouvre pour éviter les bascules accidentelles — les fichiers ne sont jamais modifiés, seul l'affichage change." data-help-title="Affichage HT / TTC" style="{{ htTtcStyle }}" onclick="{{ onToggleHtTtc }}" title="Basculer l'affichage HT / TTC">{{ htTtcLabel }}</button>
        </sc-if>
        <button data-help="Relit immédiatement tous les fichiers Excel et dossiers connectés. En temps normal ce n'est pas nécessaire : la surveillance automatique détecte seule les changements toutes les 4 secondes." data-help-title="Rafraîchir" style="{{ refreshStyle }}" onclick="{{ onRefreshAll }}" title="Rafraîchir les données maintenant">⟳ Rafraîchir</button>
        <sc-if value="{{ verifBannerOpen }}" hint-placeholder-val="{{ false }}">
          <span style="display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:9px;background:#fff7ed;border:1px solid #fbd9b4;font-size:12px;color:#b45309" title="{{ verifBannerText }}">
            <span>⚠ Corrections à valider</span>
            <button style="padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:700;color:#fff;background:#b45309;border:none;cursor:pointer;font-family:inherit" onclick="{{ onVerifBannerApply }}">Voir</button>
            <button style="padding:4px 7px;border-radius:7px;font-size:11.5px;color:#b45309;background:transparent;border:none;cursor:pointer;font-family:inherit" onclick="{{ onVerifBannerHide }}" title="Masquer">✕</button>
          </span>
        </sc-if>
        <button style="{{ helpBtnStyle }}" onclick="{{ onHelpToggle }}" data-help-btn="1" title="Mode aide : cliquez ensuite sur un chiffre pour comprendre d'où il vient">? Aide</button>
        <sc-if value="{{ isAdminUI }}" hint-placeholder-val="{{ true }}">
          <button data-help="Crée une archive .zip complète et datée : une copie du tableau de bord, toutes vos données mémorisées, et les fichiers Excel connectés. Le premier clic demande où enregistrer, les suivants réutilisent le même dossier (modifiable dans Paramètres). En cas de problème, tout se récupère depuis Paramètres → Restaurer." data-help-title="Sauvegarde" style="{{ backupBtnStyle }}" onclick="{{ onBackup }}" title="Sauvegarder une archive complète (fichiers Excel + tableau de bord)">{{ backupBtnLabel }}</button>
        </sc-if>
        <button style="{{ gearStyle }}" onclick="{{ onDisconnect }}">Déconnecter</button>
      </div>
    </div>

    <!-- Bandeau reconnexion (accès fichiers à ré-autoriser après réouverture) -->
    <sc-if value="{{ reconnectOpen }}" hint-placeholder-val="{{ false }}">
      <div style="{{ reconnectBarStyle }}">
        <span style="min-width:0">🔄 {{ reconnectLabel }}</span>
        <button style="{{ reconnectBtnStyle }}" onclick="{{ onReconnect }}">Reconnecter</button>
      </div>
    </sc-if>

    <!-- Bandeau source -->
    <sc-if value="{{ bannerVisible }}" hint-placeholder-val="{{ true }}">
      <div style="{{ bannerStyle }}">
        <span style="min-width:0">{{ bannerText }}</span>
        <div style="display:flex;gap:8px;flex-shrink:0;align-items:center">
          <sc-for list="{{ bannerActions }}" as="a" hint-placeholder-count="1">
            <button style="{{ a.style }}" onclick="{{ a.onClick }}">{{ a.label }}</button>
          </sc-for>
          <button style="{{ bannerCloseStyle }}" onclick="{{ onDismissBanner }}" title="Fermer">✕</button>
        </div>
      </div>
    </sc-if>

    <!-- Titre + contrôles -->
    <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 14px;flex-wrap:wrap;gap:14px">
      <div style="min-width:220px">
        <div style="font-size:19px;font-weight:600;color:#0e1b2e;letter-spacing:-.2px;line-height:1.25">{{ viewTitle }}</div>
        <div style="font-size:12.5px;color:#8291a5;margin-top:3px;line-height:1.4">{{ viewSubtitle }}</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <sc-if value="{{ showOpenSource }}" hint-placeholder-val="{{ false }}">
          <button data-help="Ouvre le fichier ou dossier source de cette page dans votre navigateur ou explorateur, via le lien (OneDrive, SharePoint, Google Drive…) renseigné dans Paramètres. Le tableau de bord ne modifie jamais ce fichier : il le lit seulement." data-help-title="{{ openSourceLabel }}" style="{{ openSourceStyle }}" onclick="{{ onOpenSource }}">{{ openSourceLabel }}</button>
        </sc-if>
        <sc-if value="{{ showPeriod }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:10px;align-items:center" data-help="Change la période sur laquelle TOUS les chiffres et tableaux de la page sont calculés : Cette semaine, Ce mois, Trimestre ou Année. Les flèches ◀ ▶ reculent ou avancent d'une période." data-help-title="Sélecteur de période">
            <div style="display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:3px">
              <button style="{{ prevStyle }}" onclick="{{ onPrev }}">◀</button>
              <span style="font-size:12.5px;font-weight:600;color:#0e1b2e;min-width:150px;text-align:center;white-space:nowrap">{{ periodLabel }}</span>
              <button style="{{ nextStyle }}" onclick="{{ onNext }}">▶</button>
            </div>
            <div style="display:flex;background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:3px">
              <sc-for list="{{ periods }}" as="p" hint-placeholder-count="3">
                <button style="{{ p.style }}" onclick="{{ p.onClick }}">{{ p.name }}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ showReport }}" hint-placeholder-val="{{ false }}">
          <button data-help="Génère un rapport imprimable de la période : synthèse, trésorerie, relances clients, fournisseurs, crédits et vos notes. Vous choisissez les sections à inclure, puis Aperçu / Imprimer ou enregistrement en PDF." data-help-title="Compte rendu" style="{{ reportBtnStyle }}" onclick="{{ onOpenReport }}">📄 Compte rendu</button>
        </sc-if>
        <sc-if value="{{ isFactures }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:3px" data-help="Bascule entre la liste des factures fournisseurs et le Rapprochement, qui compare votre registre interne à l'export du logiciel comptable et signale les écarts ou factures manquantes." data-help-title="Factures / Rapprochement">
            <sc-for list="{{ facTabs }}" as="t" hint-placeholder-count="4">
              <button style="{{ t.style }}" onclick="{{ t.onClick }}">{{ t.name }}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ isBordereaux }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative" data-help="Menu regroupant la connexion des dossiers de bordereaux (livraison et transport) et l'ouverture de vos modèles de bons (liens à renseigner dans Paramètres)." data-help-title="Fichiers &amp; modèles">
            <button style="{{ blMenuBtnStyle }}" onclick="{{ onToggleBlMenu }}">📁 Fichiers &amp; modèles ▾</button>
            <sc-if value="{{ blMenuOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:fixed;inset:0;z-index:70" onclick="{{ onCloseBlMenu }}"></div>
              <div style="position:absolute;top:calc(100% + 6px);left:0;width:220px;background:#fff;border:1px solid #e2e8f1;border-radius:12px;box-shadow:0 16px 32px -12px rgba(14,27,46,.35);z-index:80;padding:6px">
                <sc-for list="{{ blMenuItems }}" as="it" hint-placeholder-count="3">
                  <button style="{{ it.style }}" onclick="{{ it.onClick }}">{{ it.label }}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ isTiers }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:8px;align-items:center" data-help="À gauche : la période du classement (Mois en cours ou Année). À droite : bascule entre vos Clients (ventes) et vos Fournisseurs (achats pêcheurs)." data-help-title="Filtres Clients / Fournisseurs">
            <div style="display:flex;background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:3px">
              <sc-for list="{{ tiersPeriodTabs }}" as="t" hint-placeholder-count="2">
                <button style="{{ t.style }}" onclick="{{ t.onClick }}">{{ t.name }}</button>
              </sc-for>
            </div>
            <div style="display:flex;background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:3px">
              <sc-for list="{{ tiersTabs }}" as="t" hint-placeholder-count="2">
                <button style="{{ t.style }}" onclick="{{ t.onClick }}">{{ t.name }}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </div>

    <!-- ============ TABLEAU DE BORD / VENTES / ACHATS ============ -->
    <sc-if value="{{ dashBody }}" hint-placeholder-val="{{ true }}">
      <div data-help="{{ viewHelp }}" data-help-title="{{ viewTitle }}">
        <div style="display:flex;gap:12px;padding:0 24px">
          <sc-for list="{{ kpis }}" as="kpi" hint-placeholder-count="4">
            <div data-help="{{ kpi.help }}" data-help-title="{{ kpi.label }}" style="flex:1;min-width:0;background:#fff;border:1px solid #e9edf4;border-left:3px solid {{ kpi.spark }};border-radius:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(16,32,54,.04)">
              <div style="font-size:12.5px;color:#69788c;font-weight:500">{{ kpi.label }}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:#0e1b2e;letter-spacing:-.5px;margin-top:8px">{{ kpi.value }}</div>
              <div style="font-size:12px;font-weight:600;color:{{ kpi.deltaColor }};margin-top:5px">{{ kpi.delta }} <span style="color:#9aa7b8;font-weight:400">{{ kpi.note }}</span></div>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">
          <div style="padding:14px 24px 0">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px" data-help="Boutons de saisie rapide : lancez directement un achat pêcheur, une vente, l'enregistrement d'un paiement ou l'agenda, sans passer par le menu." data-help-title="Saisie rapide">
              <sc-for list="{{ cockpitActions }}" as="a" hint-placeholder-count="4">
                <button style="{{ a.style }}" onclick="{{ a.onClick }}">{{ a.label }}</button>
              </sc-for>
            </div>
            <div style="background:#fff;border:1px solid #e9edf4;border-radius:12px;box-shadow:0 1px 2px rgba(16,32,54,.04);padding:14px 16px" data-help="Ce qui demande votre attention aujourd'hui : factures en retard à relancer, factures fournisseurs à payer, mensualités de crédit du mois et événements de l'agenda. Cliquez une alerte pour aller directement à la page concernée." data-help-title="À faire aujourd'hui">
              <div style="font-size:13px;font-weight:700;color:#0e1b2e;margin-bottom:10px">À faire aujourd'hui</div>
              <div style="display:flex;gap:10px;flex-wrap:wrap">
                <sc-for list="{{ cockpitAlerts }}" as="al" hint-placeholder-count="3">
                  <div style="flex:1 1 240px;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid {{ al.bd }};background:{{ al.bg }}">
                    <span style="font-size:17px;flex-shrink:0">{{ al.icon }}</span>
                    <button style="flex:1;min-width:0;display:block;text-align:left;background:none;border:none;padding:0;cursor:pointer;font-family:inherit" onclick="{{ al.onClick }}"><span style="display:block;font-size:12.5px;font-weight:600;color:#0e1b2e">{{ al.text }}</span><span style="display:block;font-size:11.5px;color:#69788c;font-family:'IBM Plex Mono',monospace;margin-top:1px">{{ al.sub }}</span></button>
                    <button style="font-size:12px;font-weight:700;color:{{ al.tone }};white-space:nowrap;background:none;border:none;cursor:pointer;font-family:inherit" onclick="{{ al.onClick }}">{{ al.cta }} →</button>
                    <button title="Masquer cette notification" style="flex-shrink:0;width:22px;height:22px;border-radius:7px;border:none;background:rgba(14,27,46,.06);color:#69788c;font-size:12px;cursor:pointer;font-family:inherit;line-height:1" onclick="{{ al.onHide }}">✕</button>
                  </div>
                </sc-for>
              </div>
              <sc-if value="{{ cockpitAlertsEmpty }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:12.5px;color:#69788c;padding:2px">✅ Rien d'urgent : aucun retard ni échéance en attente. Bonne journée&nbsp;!</div>
              </sc-if>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isOverview }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:12px;padding:12px 24px 0">
            <sc-for list="{{ treasury }}" as="s" hint-placeholder-count="4">
              <div data-help="{{ s.help }}" data-help-title="{{ s.label }}" style="flex:1;min-width:0;background:#fff;border:1px solid #e9edf4;border-left:3px solid {{ s.bar }};border-radius:12px;padding:13px 16px;box-shadow:0 1px 2px rgba(16,32,54,.04)">
                <div style="font-size:12px;color:#69788c;font-weight:500">{{ s.label }}</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:{{ s.valueColor }};margin-top:6px">{{ s.value }}</div>
                <div style="font-size:11.5px;color:#9aa7b8;margin-top:4px">{{ s.note }}</div>
                <sc-if value="{{ s.soldeLine }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:9px;border-top:1px solid #f1f4f8;padding-top:9px">
                    <span style="font-size:11px;color:#8291a5;white-space:nowrap">Solde compte</span>
                    <span style="font-size:14px;font-weight:600;color:#0e1b2e;font-family:'IBM Plex Mono',monospace">{{ s.soldeLine }}</span>
                  </div>
                  <div style="font-size:10.5px;color:#aeb8c6;margin-top:3px;text-align:right">{{ s.soldeSource }}</div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ agHomeShow }}" hint-placeholder-val="{{ false }}">
          <div style="padding:12px 24px 0">
            <div style="background:#fff;border:1px solid #e9edf4;border-radius:12px;box-shadow:0 1px 2px rgba(16,32,54,.04);overflow:hidden">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #eef1f6">
                <div style="display:flex;align-items:center;gap:9px">
                  <span style="font-size:14px;font-weight:600;color:#0e1b2e">📅 Agenda — à venir</span>
                  <sc-if value="{{ agTodayCount }}" hint-placeholder-val="{{ false }}">
                    <span style="{{ agHomeReminderStyle }}">🔔 {{ agTodayCount }} aujourd'hui</span>
                  </sc-if>
                </div>
                <button style="{{ agTodayBtnStyle }}" onclick="{{ onGoAgenda }}">Ouvrir l'agenda →</button>
              </div>
              <sc-if value="{{ agEmptyUpcoming }}" hint-placeholder-val="{{ false }}">
                <div style="padding:16px;text-align:center;color:#9aa7b8;font-size:12.5px">Aucun événement à venir. <button style="background:none;border:none;color:{{ accentColor }};font-weight:600;cursor:pointer;font-family:inherit;font-size:12.5px;padding:0" onclick="{{ onGoAgenda }}">Ajouter un événement</button></div>
              </sc-if>
              <div style="display:flex;flex-wrap:wrap">
                <sc-for list="{{ agSoonHome }}" as="o" hint-placeholder-count="3">
                  <div style="flex:1 1 260px;min-width:0;display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-right:1px solid #f6f8fb;cursor:pointer" onclick="{{ o.onOpen }}">
                    <span style="{{ o.dotStyle }};margin-top:4px"></span>
                    <div style="min-width:0">
                      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span style="font-size:12.5px;font-weight:600;color:#0e1b2e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ o.title }}</span><span style="{{ o.relStyle }}">{{ o.rel }}</span></div>
                      <div style="font-size:11px;color:#69788c;margin-top:2px">{{ o.dateLabel }} <span style="color:#0e1b2e;font-weight:600">{{ o.time }}</span></div>
                    </div>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-if>

        <div style="display:flex;gap:20px;padding:16px 24px 24px;align-items:flex-start">
          <sc-if value="{{ isAchatView }}" hint-placeholder-val="{{ false }}">
          <div style="flex:1;min-width:0;background:#fff;border:1px solid #e9edf4;border-radius:14px;box-shadow:0 1px 2px rgba(16,32,54,.04);overflow:hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #eef1f6;flex-wrap:wrap;gap:10px">
              <div style="display:flex;align-items:baseline;gap:10px">

  <!-- ============ LIGNES DE STOCK EN ATTENTE — liste CLIQUABLE ============
       Une ligne = un clic. Aucune ressaisie : espèce, calibre, poids et prix sont déjà lus dans le
       fichier de stock, ils pré-remplissent le formulaire d'achat. -->
  <sc-if value="{{ stockPickOpen }}" hint-placeholder-val="{{ false }}">
    <div style="{{ prefixOverlayStyle }}" onclick="{{ onStockPickClose }}">
      <div style="width:760px;max-width:95vw;max-height:86vh;overflow:auto;background:#fff;border:1px solid #e2e8f1;border-radius:16px;box-shadow:0 30px 60px -24px rgba(14,27,46,.5);font-family:inherit" onclick="{{ ctxStop }}">

          <div style="font-size:12.5px;color:#69788c;margin-top:7px;line-height:1.6">Cette marchandise est entrée au stock sans achat pêcheur correspondant. <b>Cliquez sur une ligne</b> : le formulaire d'achat se remplit tout seul avec le pêcheur, l'espèce, le calibre, le poids et le prix. Le stock ne sera pas réécrit, la ligne existe déjà.</div>
        </div>
        <div style="display:grid;grid-template-columns:minmax(90px,1fr) 70px minmax(110px,1.2fr) 88px 92px 92px;gap:8px;padding:9px 12px;background:#f8fafc;border-top:1px solid #eef1f6;border-bottom:1px solid #eef1f6;font-size:10.5px;font-weight:600;color:#93a1b3;text-transform:uppercase;letter-spacing:.3px">
          <span>Espèce</span><span>Calibre</span><span>Pêcheur</span><span style="text-align:right">Poids</span><span style="text-align:right">Prix</span><span style="text-align:right">Total</span>
        </div>

            <span style="color:#0e1b2e;font-weight:600">{{ s.espece }}</span>
            <span style="color:#69788c">{{ s.calibre }}</span>
            <span style="color:#0e1b2e">{{ s.client }}</span>
            <span style="text-align:right;font-family:'IBM Plex Mono',monospace;color:#3a4a5e">{{ s.poids }}</span>
            <span style="text-align:right;font-family:'IBM Plex Mono',monospace;color:#69788c">{{ s.prix }}</span>

        </div>
      </div>
    </div>

  <!-- ============ FICHE TIERS (client / fournisseur) ============
       Une seule série sur la courbe → pas de légende, le titre nomme la donnée. Barres en HTML
       (aucune dépendance) : extrémité arrondie posée sur la ligne de base, écart entre barres,
       axes discrets, et UNE seule étiquette directe (le mois le plus fort). Le détail se lit au
       survol de chaque barre, et le tableau des factures sert de vue chiffrée. -->
  <sc-if value="{{ ficheOpen }}" hint-placeholder-val="{{ false }}">
    <div style="{{ prefixOverlayStyle }}" onclick="{{ onFicheClose }}">
      <div style="width:860px;max-width:95vw;max-height:88vh;overflow:auto;background:#fff;border:1px solid #e2e8f1;border-radius:16px;box-shadow:0 30px 60px -24px rgba(14,27,46,.5);font-family:inherit;padding:22px" onclick="{{ ctxStop }}">

          <div style="min-width:0">
            <div style="font-size:17px;font-weight:700;color:#0e1b2e">{{ ficheTitle }}</div>
            <div style="font-size:12.5px;color:#8291a5;margin-top:4px">{{ ficheSub }}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <sc-if value="{{ ficheCanRelance }}" hint-placeholder-val="{{ false }}">

            </sc-if>
            <button style="{{ fichePrintStyle }}" onclick="{{ onFichePrint }}" title="Imprimer cette fiche ou l'enregistrer en PDF">🖨 Imprimer la fiche</button>
            <sc-if value="{{ ficheIsClient }}" hint-placeholder-val="{{ false }}">

            </sc-if>
            <button style="{{ agBtnGhost }}" onclick="{{ onFicheClose }}">Fermer</button>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <sc-for list="{{ ficheKpis }}" as="k" hint-placeholder-count="5">
            <div style="flex:1;min-width:150px;background:#fff;border:1px solid #e9edf4;border-left:3px solid {{ k.bar }};border-radius:12px;padding:12px 14px">
              <div style="font-size:11.5px;color:#69788c;font-weight:500">{{ k.label }}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:{{ k.valueColor }};margin-top:5px">{{ k.value }}</div>
              <div style="font-size:11px;color:#9aa7b8;margin-top:3px">{{ k.note }}</div>
            </div>
          </sc-for>
        </div>

        <div style="margin-top:18px;border:1px solid #eef1f6;border-radius:12px;padding:16px 18px">
          <div style="font-size:13px;font-weight:700;color:#0e1b2e;margin-bottom:14px">{{ ficheChartTitle }}</div>
          <sc-if value="{{ ficheBarsEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="padding:22px 0;text-align:center;color:#9aa7b8;font-size:12.5px">Aucun mouvement sur les 12 derniers mois.</div>

            <sc-for list="{{ ficheBars }}" as="b" hint-placeholder-count="12">

              <div style="flex:1;text-align:center;font-size:10.5px;color:#9aa7b8">{{ b.label }}</div>
            </sc-for>
          </div>
        </div>

        <div style="display:flex;gap:14px;margin-top:16px;flex-wrap:wrap">
          <div style="flex:1 1 300px;border:1px solid #eef1f6;border-radius:12px;padding:15px 17px">
            <div style="font-size:13px;font-weight:700;color:#0e1b2e;margin-bottom:12px">Moyens de paiement</div>
            <sc-for list="{{ ficheMoyens }}" as="m" hint-placeholder-count="3">

              <span>Date</span><span>N°</span><span style="text-align:right">Montant</span><span style="text-align:right">Reste</span><span>État</span><span></span>
            </div>
            <sc-for list="{{ ficheFactures }}" as="r" hint-placeholder-count="5">
              <div style="display:grid;grid-template-columns:82px 1fr 92px 84px 96px 34px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f4f6fa;font-size:12.5px">

<!-- ============ MODE AIDE (Helpeur) : bandeau d'instruction + bulle d'explication ============ -->
<sc-if value="{{ helpHintOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e1b2e;color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:12px;box-shadow:0 14px 34px rgba(4,12,26,.45);z-index:9400;display:flex;align-items:center;gap:10px;white-space:nowrap">
    <span>❓ Mode aide activé — cliquez sur un chiffre ou une carte pour comprendre d'où il vient. Échap ou « ? Aide » pour quitter.</span>
  </div>
</sc-if>
<sc-if value="{{ helpTip }}" hint-placeholder-val="{{ false }}">
  <div data-help-tip="1" style="{{ helpTipStyle }}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="font-size:13px;font-weight:700;color:#0e1b2e;line-height:1.3">{{ helpTip.title }}</div>
      <button data-help-tip="1" style="width:22px;height:22px;border:1px solid #dde3ec;background:#fff;border-radius:6px;color:#69788c;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;flex-shrink:0" onclick="{{ onHelpTipClose }}" title="Fermer">✕</button>
    </div>
    <div style="font-size:12.5px;color:#3a4a5e;line-height:1.65;margin-top:6px">{{ helpTip.text }}</div>
  </div>
</sc-if>

<!-- ============ CHARGES FIXES / VARIABLES : sélection des dépenses (pop-up) ============ -->
<sc-if value="{{ chargesPickOpen }}" hint-placeholder-val="{{ false }}">
  <div style="{{ prefixOverlayStyle }}" onclick="{{ onChargesPickClose }}">
    <div style="width:560px;max-width:100%;max-height:84vh;display:flex;flex-direction:column;background:#fff;border:1px solid #e2e8f1;border-radius:16px;box-shadow:0 30px 60px -24px rgba(14,27,46,.5);font-family:inherit" onclick="{{ ctxStop }}">
      <div style="padding:20px 22px 12px">
        <div style="font-size:15px;font-weight:700;color:#0e1b2e">{{ chargesPickTitle }}</div>
        <div style="font-size:12.5px;color:#69788c;margin-top:6px;line-height:1.55">Cochez les dépenses de votre relevé bancaire qui appartiennent à ce groupe. Le cochage se fait par libellé : les prélèvements suivants au même libellé compteront automatiquement, tous les mois.</div>
        <input style="width:100%;box-sizing:border-box;margin-top:12px;padding:8px 12px;border:1px solid #dde3ec;border-radius:9px;font-size:12.5px;font-family:inherit;color:#0e1b2e;background:#fbfcfe" placeholder="🔍 Filtrer les libellés…" value="{{ chargesPickQ }}" oninput="{{ onChargesPickQ }}">
      </div>
      <div style="flex:1;overflow:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:3px">
        <sc-for list="{{ chargesPickItems }}" as="it" hint-placeholder-count="8">
          <div style="{{ it.rowStyle }}" onclick="{{ it.onToggle }}">
            <input type="checkbox" checked="{{ it.checked }}" style="width:16px;height:16px;flex-shrink:0;pointer-events:none;accent-color:#1a56db">
            <div style="min-width:0;flex:1">
              <div style="font-size:12.5px;font-weight:500;color:#0e1b2e;font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</div>
              <div style="font-size:11px;color:#9aa7b8;margin-top:2px">{{ it.count }} <span style="color:#b45309">{{ it.otherNote }}</span></div>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ chargesPickEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:26px 10px;text-align:center;color:#9aa7b8;font-size:12.5px;font-style:italic">Aucune dépense dans le relevé bancaire pour le moment. Importez votre relevé depuis Paramètres (ou l'onglet Banque) — les dépenses apparaîtront ici.</div>
        </sc-if>
        <sc-if value="{{ chargesPickNoResult }}" hint-placeholder-val="{{ false }}">
          <div style="padding:20px 10px;text-align:center;color:#9aa7b8;font-size:12.5px;font-style:italic">Aucun libellé ne correspond au filtre.</div>
        </sc-if>
      </div>
      <div style="display:flex;justify-content:flex-end;padding:12px 22px 18px;border-top:1px solid #eef1f6">
        <button style="{{ prefixCancelStyle }}" onclick="{{ onChargesPickClose }}">Fermer</button>
      </div>
    </div>
  </div>
</sc-if>

<!-- ============ ÉCRAN D'ACCUEIL « QUI ÊTES-VOUS ? » ============ -->
<sc-if value="{{ hPrintOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;background:rgba(14,27,46,.55);z-index:9500;display:flex;align-items:center;justify-content:center;padding:20px" onclick="{{ onHPrintCancel }}">
    <div style="width:460px;max-width:94vw;background:#fff;border-radius:16px;padding:22px;box-shadow:0 30px 60px -24px rgba(14,27,46,.5)" onclick="{{ ctxStop }}">
      <div style="font-size:17px;font-weight:700;color:#0e1b2e">Imprimer les heures</div>
      <sc-if value="{{ hPrintChooseEmployee }}" hint-placeholder-val="{{ true }}">
        <div><div style="font-size:12.5px;color:#69788c;margin-top:6px">1. Choisissez l'employé à imprimer.</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:16px"><sc-for list="{{ hPrintItems }}" as="p" hint-placeholder-count="3"><button style="{{ p.style }}" onclick="{{ p.onClick }}">{{ p.label }}</button></sc-for></div></div>
      </sc-if>
      <sc-if value="{{ hPrintChoosePeriod }}" hint-placeholder-val="{{ false }}">
        <div><div style="font-size:12.5px;color:#69788c;margin-top:6px">2. Choisissez la période pour {{ hPrintEmployeeName }}.</div><div style="display:flex;flex-direction:column;gap:9px;margin-top:16px"><button style="{{ hPrintPeriodStyle }}" onclick="{{ onHPrintWeek }}">Semaine affichée · {{ hPrintWeekLabel }}</button><button style="{{ hPrintPeriodStyle }}" onclick="{{ onHPrintMonth }}">Mois complet · {{ hPrintMonthLabel }}</button><button style="{{ hPrintBackStyle }}" onclick="{{ onHPrintBack }}">← Changer de personne</button></div></div>
      </sc-if>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><button style="{{ prefixCancelStyle }}" onclick="{{ onHPrintCancel }}">Annuler</button></div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ vehicleBankOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;background:rgba(14,27,46,.55);z-index:9500;display:flex;align-items:center;justify-content:center;padding:20px" onclick="{{ onVehicleBankClose }}">
    <div style="width:680px;max-width:95vw;max-height:85vh;overflow:auto;background:#fff;border-radius:16px;padding:22px" onclick="{{ ctxStop }}">
      <div style="font-size:17px;font-weight:700;color:#0e1b2e">Factures et opérations du véhicule</div>
      <div style="font-size:12px;color:#69788c;margin:6px 0 14px">Cochez manuellement les lignes bancaires liées à ce véhicule.</div>
      <sc-for list="{{ vehicleBankRows }}" as="b" hint-placeholder-count="6">
        <label style="display:grid;grid-template-columns:22px 90px 1fr 120px;gap:8px;padding:9px;border-top:1px solid #eef1f6;font-size:12.5px;align-items:center"><input type="checkbox" checked="{{ b.checked }}" onchange="{{ b.onToggle }}"><span>{{ b.date }}</span><span>{{ b.label }}</span><span style="text-align:right">{{ b.amount }}</span></label>
      </sc-for>
      <div style="display:flex;justify-content:flex-end;margin-top:14px"><button style="{{ prefixCancelStyle }}" onclick="{{ onVehicleBankClose }}">Fermer</button></div>
    </div>
  </div>
</sc-if>

<!-- ============ ÉCRAN D'ACCUEIL « QUI ÊTES-VOUS ? » ============ -->
<sc-if value="{{ whoOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;background:rgba(14,27,46,.58);z-index:9600;display:flex;align-items:center;justify-content:center;padding:20px">
    <div class="who-card" style="background:#fff;border-radius:20px;padding:38px 44px 34px;box-shadow:0 40px 80px -30px rgba(14,27,46,.6);text-align:center;max-width:640px;font-family:inherit">
      <div style="display:flex;align-items:center;justify-content:center;gap:12px">
        <sc-if value="{{ entLogo }}" hint-placeholder-val="{{ false }}">
          <img src="{{ entLogo }}" alt="" style="width:44px;height:44px;border-radius:11px;object-fit:cover">
        </sc-if>
        <sc-if value="{{ entNoLogo }}" hint-placeholder-val="{{ true }}">
          <div style="{{ brandStyle }}">{{ entInitials }}</div>
        </sc-if>
        <span style="font-size:15px;font-weight:600;color:#69788c">Dashboard {{ entNom }}</span>
      </div>
      <div style="font-size:22px;font-weight:700;color:#0e1b2e;margin-top:20px;letter-spacing:-.01em">Qui êtes-vous ?</div>
      <div style="font-size:13px;color:#8291a5;margin-top:8px;line-height:1.6">Choisissez votre profil — l'affichage s'adapte automatiquement.<br>Le profil en couleur est le dernier utilisé.</div>
      <div style="display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:22px;background:#eef1f6;border-radius:12px;padding:5px">
        <sc-for list="{{ whoItems }}" as="w" hint-placeholder-count="3">
          <button style="{{ w.style }}" onclick="{{ w.onClick }}" title="{{ w.sub }}">{{ w.label }}</button>
        </sc-for>
      </div>
    </div>
  </div>
</sc-if>
</template>
<script src="script.js"></script>
</body>
</html>
